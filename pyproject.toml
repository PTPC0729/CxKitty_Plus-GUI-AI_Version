[tool.poetry]
name = "CxKitty"
version = "0.5.0"
description = "超星学习通答题姬"
authors = ["SocialSisterYi"]
license = "GPL-3.0"
readme = "README.md"
package-mode = false

[[tool.poetry.source]]
name = "tsinghua"
url = "https://pypi.tuna.tsinghua.edu.cn/simple"
priority = "primary"


[tool.poetry.dependencies]
python = ">=3.10,<3.15"
PySide6 = ">=6.6,<6.12"
requests = "^2.28.1"
qrcode = ">=7.3.1,<9"
rich = ">=12.6,<16"
pycryptodome = "^3.15.0"
lxml = ">=4.9,<7"
pyyaml = "^6.0"
jsonpath-python = "^1.0.6"
wcwidth = "^0.2.5"


[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"
